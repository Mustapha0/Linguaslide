name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python (for icon generation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: |
          npm run build
          test -f dist/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Install native Android Documents saver
        run: |
          mkdir -p android/app/src/main/java/com/example/linguaslides
          cat > android/app/src/main/java/com/example/linguaslides/NativeDocumentSaverPlugin.java <<'JAVA'
          package com.example.linguaslides;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.DocumentsContract;
          import android.provider.MediaStore;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;
          import java.io.InputStream;
          import java.io.IOException;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.FileInputStream;

          @CapacitorPlugin(name = "NativeDocumentSaver")
          public class NativeDocumentSaverPlugin extends Plugin {
              private String pendingPath = "";
              private String pendingName = "";

              @PluginMethod
              public void save(PluginCall call) {
                  String filename = call.getString("filename", "linguaslides-export.json");
                  String mimeType = call.getString("mimeType", "application/octet-stream");
                  String data = call.getString("data", "");
                  if (data == null || data.length() < 4) {
                      call.reject("No file data was provided; refusing to create a zero-byte file.");
                      return;
                  }
                  byte[] bytes;
                  try {
                      bytes = Base64.decode(data, Base64.DEFAULT);
                  } catch (Exception e) {
                      call.reject("Could not decode file data: " + e.getMessage());
                      return;
                  }
                  if (bytes.length < 1) {
                      call.reject("Decoded file is empty; refusing to save 0 bytes.");
                      return;
                  }
                  Integer expected = call.getInt("expectedBytes");
                  if (expected != null && expected.intValue() != bytes.length) {
                      call.reject("File data length mismatch: expected " + expected + " bytes but received " + bytes.length + ".");
                      return;
                  }
                  // Android 10+: write straight into Documents/LinguaSlides. No picker, so there is no empty placeholder
                  // file and nothing is lost if Android recreates the app while a picker is open.
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentResolver resolver = getContext().getContentResolver();
                      Uri target = null;
                      try {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, filename);
                          values.put(MediaStore.MediaColumns.MIME_TYPE, mimeType);
                          values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOCUMENTS + "/LinguaSlides");
                          values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                          target = resolver.insert(MediaStore.Files.getContentUri("external"), values);
                          if (target == null) throw new IOException("Could not create the file in Documents.");
                          try (OutputStream out = resolver.openOutputStream(target, "w")) {
                              if (out == null) throw new IOException("Could not open the Documents file for writing.");
                              out.write(bytes);
                              out.flush();
                          }
                          long saved = 0;
                          try (InputStream in = resolver.openInputStream(target)) {
                              if (in == null) throw new IOException("Could not verify the saved file.");
                              byte[] buf = new byte[8192];
                              int n;
                              while ((n = in.read(buf)) != -1) saved += n;
                          }
                          if (saved != bytes.length) throw new IOException("Saved size mismatch: expected " + bytes.length + " bytes, read back " + saved + ".");
                          ContentValues done = new ContentValues();
                          done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                          resolver.update(target, done, null, null);
                          JSObject ok = new JSObject();
                          ok.put("cancelled", false);
                          ok.put("uri", target.toString());
                          ok.put("filename", filename);
                          ok.put("bytesWritten", saved);
                          ok.put("location", "Documents/LinguaSlides");
                          call.resolve(ok);
                          return;
                      } catch (Exception directError) {
                          if (target != null) {
                              try { resolver.delete(target, null, null); } catch (Exception ignore) { }
                          }
                          // fall through to the Save-as picker below
                      }
                  }
                  try {
                      // Stage payload to app-private storage before launching the picker. This protects
                      // the bytes if Android recreates the Activity while the document picker is open.
                      File staged = File.createTempFile("linguaslides-export-", ".bin", getContext().getCacheDir());
                      try (FileOutputStream fileOut = new FileOutputStream(staged)) {
                          fileOut.write(bytes);
                          fileOut.flush();
                          fileOut.getFD().sync();
                      }
                      pendingPath = staged.getAbsolutePath();
                      pendingName = filename;
                  } catch (Exception e) {
                      call.reject("Could not stage export data: " + e.getMessage(), e);
                      return;
                  }
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType(mimeType);
                  intent.putExtra(Intent.EXTRA_TITLE, filename);
                  startActivityForResult(call, intent, "handleSaveResult");
              }

              @ActivityCallback
              public void handleSaveResult(PluginCall call, ActivityResult result) {
                  String stagedPath = pendingPath;
                  String name = pendingName;
                  pendingPath = "";
                  pendingName = "";
                  if (call == null) { return; }
                  Intent resultIntent = result == null ? null : result.getData();
                  if (result == null || result.getResultCode() != Activity.RESULT_OK || resultIntent == null || resultIntent.getData() == null) {
                      if (!stagedPath.isEmpty()) new File(stagedPath).delete();
                      JSObject cancelled = new JSObject();
                      cancelled.put("cancelled", true);
                      call.resolve(cancelled);
                      return;
                  }
                  if (stagedPath == null || stagedPath.isEmpty()) {
                      call.reject("Export data was lost before the save completed. Please export again.");
                      return;
                  }
                  Uri uri = resultIntent.getData();
                  File staged = new File(stagedPath);
                  try {
                      if (!staged.isFile() || staged.length() < 1) throw new IOException("Staged export is empty.");
                      long expectedBytes = staged.length();
                      try (InputStream input = new FileInputStream(staged);
                           OutputStream output = getContext().getContentResolver().openOutputStream(uri, "w")) {
                          if (output == null) throw new IOException("Could not open the selected destination.");
                          byte[] buffer = new byte[8192];
                          int count;
                          long written = 0;
                          while ((count = input.read(buffer)) != -1) {
                              output.write(buffer, 0, count);
                              written += count;
                          }
                          output.flush();
                          if (written != expectedBytes) {
                              throw new IOException("Write count mismatch: expected " + expectedBytes + " bytes, wrote " + written + ".");
                          }
                      }
                      // Read back the saved document and verify byte count; do not report success for 0 B files.
                      long savedBytes = 0;
                      try (InputStream verify = getContext().getContentResolver().openInputStream(uri)) {
                          if (verify == null) throw new IOException("Could not verify the saved file.");
                          byte[] buffer = new byte[8192];
                          int count;
                          while ((count = verify.read(buffer)) != -1) savedBytes += count;
                      }
                      if (savedBytes != expectedBytes || savedBytes < 1) {
                          throw new IOException("Saved file size mismatch: expected " + expectedBytes + " bytes, read back " + savedBytes + ".");
                      }
                      JSObject response = new JSObject();
                      response.put("cancelled", false);
                      response.put("uri", uri.toString());
                      response.put("filename", name);
                      response.put("bytesWritten", savedBytes);
                      call.resolve(response);
                  } catch (Exception error) {
                      try { DocumentsContract.deleteDocument(getContext().getContentResolver(), uri); } catch (Exception ignore) { }
                    call.reject("Could not save and verify the file: " + error.getMessage(), error);
                  } finally {
                      staged.delete();
                  }
              }
          }
          JAVA
          cat > android/app/src/main/java/com/example/linguaslides/MainActivity.java <<'JAVA'
          package com.example.linguaslides;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(NativeDocumentSaverPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Apply app icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import base64, io, os
          from PIL import Image, ImageDraw, ImageFilter, ImageChops

          RES = os.environ.get("RES_DIR", "android/app/src/main/res")
          NAVY = (13, 31, 83, 255)
          SRC = ""

          sq = Image.open(io.BytesIO(base64.b64decode(SRC))).convert("RGBA")
          N = sq.size[0]

          # Soft-edged copy for the adaptive foreground (fades the outer border into the navy background)
          m = Image.new("L", (N, N), 0)
          ImageDraw.Draw(m).rectangle((round(N*0.06), round(N*0.06), N-round(N*0.06), N-round(N*0.06)), fill=255)
          m = m.filter(ImageFilter.GaussianBlur(N*0.028))
          alpha = ImageChops.multiply(m, sq.split()[3].filter(ImageFilter.MinFilter(3)))
          soft = sq.copy(); soft.putalpha(alpha)

          def fit(img, size):
              return img.resize((size, size), Image.LANCZOS)

          dens = {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216), "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}
          for d, (legacy, fg) in dens.items():
              out = os.path.join(RES, "mipmap-" + d)
              os.makedirs(out, exist_ok=True)
              for stale in ("ic_launcher.webp", "ic_launcher_round.webp", "ic_launcher_foreground.webp"):
                  p = os.path.join(out, stale)
                  if os.path.exists(p): os.remove(p)
              c = Image.new("RGBA", (fg, fg), (0, 0, 0, 0)); inner = round(fg * 0.72)
              c.alpha_composite(fit(soft, inner), ((fg - inner) // 2, (fg - inner) // 2))
              c.save(os.path.join(out, "ic_launcher_foreground.png"))
              fit(sq, legacy).save(os.path.join(out, "ic_launcher.png"))
              S = legacy * 4
              r = Image.new("RGBA", (S, S), (0, 0, 0, 0)); ImageDraw.Draw(r).ellipse((0, 0, S-1, S-1), fill=NAVY)
              inner = round(S * 0.86); r.alpha_composite(fit(sq, inner), ((S - inner) // 2, (S - inner) // 2))
              mask = Image.new("L", (S, S), 0); ImageDraw.Draw(mask).ellipse((0, 0, S-1, S-1), fill=255)
              r.putalpha(Image.composite(r.split()[3], Image.new("L", (S, S), 0), mask))
              r.resize((legacy, legacy), Image.LANCZOS).save(os.path.join(out, "ic_launcher_round.png"))

          v26 = os.path.join(RES, "mipmap-anydpi-v26"); os.makedirs(v26, exist_ok=True)
          xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          """
          for n in ("ic_launcher.xml", "ic_launcher_round.xml"):
              open(os.path.join(v26, n), "w").write(xml)
          vals = os.path.join(RES, "values"); os.makedirs(vals, exist_ok=True)
          open(os.path.join(vals, "ic_launcher_background.xml"), "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0D1F53</color>\n</resources>\n')
          print("App icons generated in", RES)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linguaslides-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
